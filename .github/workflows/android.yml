name: Android

on:
  push:
    paths:
      - 'android/**'
      - 'shared/AppLogos/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'shared/AppLogos/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.11.1'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches ~/.gradle (including the wrapper distribution). It does not
      # provision a Gradle version itself: that single download hit repeated
      # 504s from Gradle's CDN, so the wrapper below fetches with retries.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper JAR is a binary that could not be produced where this
      # project was written. When the repository lacks it, generate one in an
      # empty directory (so this project's build scripts are not evaluated by
      # whatever Gradle the runner ships), or fall back to the JAR in Gradle's
      # own repository at the pinned tag.
      - name: Generate Gradle wrapper JAR if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            scratch="$(mktemp -d)"
            if command -v gradle >/dev/null 2>&1 &&
               (cd "$scratch" && touch settings.gradle && gradle --no-daemon -q wrapper --gradle-version "$GRADLE_VERSION"); then
              cp "$scratch/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
            else
              curl -fsSL --retry 5 --retry-all-errors -o gradle/wrapper/gradle-wrapper.jar \
                "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar"
            fi
          fi
          chmod +x gradlew

      - name: Download Gradle distribution
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew --no-daemon --version && exit 0
            echo "Gradle download failed (attempt $attempt), retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Unit tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wechatbridge-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/tests/
          if-no-files-found: ignore
